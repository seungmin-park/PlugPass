spring.application.name=plugpass
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Local development: embedded in-memory H2; data is discarded on shutdown.
spring.datasource.generate-unique-name=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Ingestion is not scheduled yet. Never store the issued service key here.
plugpass.public-data.endpoint=${PLUGPASS_PUBLIC_DATA_URL:https://apis.data.go.kr/B552584/EvCharger/getChargerInfo}
plugpass.public-data.service-key=${PLUGPASS_PUBLIC_DATA_SERVICE_KEY:}
plugpass.public-data.page-size=${PLUGPASS_PUBLIC_DATA_PAGE_SIZE:9999}
plugpass.public-data.region=${PLUGPASS_PUBLIC_DATA_REGION:28}
plugpass.public-data.connect-timeout=${PLUGPASS_PUBLIC_DATA_CONNECT_TIMEOUT:3s}
plugpass.public-data.response-timeout=${PLUGPASS_PUBLIC_DATA_RESPONSE_TIMEOUT:10s}

# Provisional policy for trusted source observations, not a provider freshness promise.
plugpass.freshness.max-age=${PLUGPASS_FRESHNESS_MAX_AGE:PT10M}
