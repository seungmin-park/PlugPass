spring.datasource.generate-unique-name=false
spring.datasource.url=${PLUGPASS_DATABASE_URL}
spring.datasource.username=${PLUGPASS_DATABASE_USERNAME:plugpass}
spring.datasource.password=${PLUGPASS_DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.datasource.hikari.data-source-properties.preserveInstants=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.fail-on-missing-locations=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.h2.console.enabled=false
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
