plugins {
	id 'java'
	id 'org.asciidoctor.jvm.convert' version '4.0.5'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.plugpass'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

configurations {
	asciidoctorExt
}

dependencies {
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.h2database:h2'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'com.tngtech.archunit:archunit:1.5.1'
	asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// API documentation is generated only after its contract tests pass.
def snippetsDirectory = layout.buildDirectory.dir('generated-snippets')

tasks.named('test') {
    outputs.dir(snippetsDirectory)
    doFirst {
        delete(snippetsDirectory)
    }
}

asciidoctorj {
    version = '3.0.0'
    fatalWarnings missingIncludes()
}

tasks.named('asciidoctor') {
    dependsOn tasks.named('test')
    configurations 'asciidoctorExt'
    inputs.dir(snippetsDirectory)
    attributes 'snippets': snippetsDirectory.get().asFile.absolutePath
}

tasks.named('bootJar') {
    dependsOn tasks.named('asciidoctor')
    from(tasks.named('asciidoctor').map { it.outputDir }) {
        into 'BOOT-INF/classes/static/docs'
    }
}

// The performance harness lives on the test classpath, outside the shipped JAR.
tasks.register('performanceClasspath') {
    dependsOn tasks.named('testClasses')
    doLast {
        layout.buildDirectory.file('performance-classpath.txt').get().asFile.text = sourceSets.test.runtimeClasspath.asPath
    }
}
