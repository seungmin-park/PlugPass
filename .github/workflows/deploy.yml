name: Production CD
on:
  workflow_run:
    workflows: [PlugPass CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful current main push CI run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: plugpass-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.CD_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Verify successful CI provenance and payload
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
        run: python3 scripts/prepare_service_cd.py "$REQUESTED_RUN"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.CD_WIF_PROVIDER }}
          service_account: ${{ vars.CD_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Deploy through IAP and restricted SSH entry
        env:
          GH_TOKEN: ${{ github.token }}
          CD_PROJECT: project-687f2332-ff8d-4a13-95a
          CD_ZONE: asia-northeast3-a
          CD_INSTANCE: deploy-vm
          CD_SSH_KEY: ${{ secrets.CD_SSH_PRIVATE_KEY }}
          CD_HOST_KEY: ${{ vars.CD_SSH_HOST_KEY }}
        run: python3 scripts/run_service_cd.py
